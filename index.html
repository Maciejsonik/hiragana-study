<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aplikacja do nauki japońskiej kany — hiragany i katakany, z animacjami kresek i trybem egzaminu.">
  <title>Kana — nauka i egzamin</title>

  <!-- T14 — PWA. Ścieżki WZGLĘDNE, bo aplikacja żyje pod /hiragana-study/. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Kolor paska zależny od motywu systemu; manifest deklaruje dark jako domyślny. -->
  <meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kana">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!--
    Ustawiamy motyw przed pierwszym rysowaniem, żeby nie było prześwitu.
    Kolejność: hiragana-settings → stary hiragana-theme (migracja) → system.
    Ten sam zestaw wartości, co `readLegacyTheme()`/`resolveTheme()` w app.js,
    żeby pierwszy paint i aplikacja zawsze się zgadzały.
    Bootstrap nic nie zapisuje — właściwa migracja należy do `loadSettings()`.
  -->
  <script>
    (function () {
      var theme = null;   // null = jeszcze nie ustalone

      try {
        var raw = localStorage.getItem('hiragana-settings');

        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && ['light', 'dark', 'system'].indexOf(parsed.theme) !== -1) {
            theme = parsed.theme;
          }
        }
      } catch (error) {
        /* uszkodzony zapis - próbujemy klucza sprzed T26 */
      }

      // klucz sprzed T26 tylko wtedy, gdy nowy store niczego nie dał
      if (theme === null) {
        try {
          var legacy = localStorage.getItem('hiragana-theme');
          if (legacy === 'light' || legacy === 'dark') {
            theme = legacy;
          }
        } catch (error) {
          /* zostajemy przy 'system' */
        }
      }

      document.documentElement.dataset.theme = (theme === null || theme === 'system')
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div id="scriptEyebrow" class="eyebrow">JAPOŃSKI • HIRAGANA</div>
        <h1 id="appTitle">Hiragana</h1>
      </div>
      <div class="topbar-actions">
        <button id="homeBtn" class="ghost hidden">← Menu</button>
        <button id="muteToggle" class="icon-btn" type="button" aria-label="Wycisz dźwięk"></button>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Zmień motyw"></button>
      </div>
    </header>

    <main id="app"></main>

    <footer>
      <span>Prosta aplikacja lokalna</span>
      <span>•</span>
      <span>Podstawowe znaki + modyfikowane</span>
      <span>•</span>
      <span>Kształty znaków: KanjiVG (CC BY-SA 3.0)</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
