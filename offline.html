<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Kana</title>
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #121116;
      color: #f3eff8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 420px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { color: #aaa3b2; line-height: 1.6; margin: 0 0 20px; }
    button {
      font: inherit;
      font-weight: 700;
      padding: 12px 28px;
      border: 2px solid #39333f;
      border-radius: 999px;
      background: #30264a;
      color: #f3eff8;
      cursor: pointer;
    }
    button:hover { border-color: #c4a8ff; }
    button:focus-visible { outline: 2px solid #9b70ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <!--
    Ostatnia linia obrony: wyświetlana tylko wtedy, gdy przeglądarka jest
    offline ORAZ dokument aplikacji nie jest w cache. Przy normalnej
    pracy offline Service Worker serwuje `index.html` z `shell-v*`.
  -->
  <main>
    <h1>Brak połączenia</h1>
    <p>Aplikacja nie została jeszcze pobrana na to urządzenie. Podłącz się do sieci i otwórz aplikację ponownie — od tej chwili będzie działać offline.</p>
    <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
  </main>
</body>
</html>
